<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apollo配置管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #17a2b8;
            --success: #28a745;
            --danger: #dc3545;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            background: #1a1a2e;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            background: rgba(30, 30, 45, 0.7);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .main-container {
            display: none;
        }

        .nav-tabs {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .nav-tabs .nav-link {
            color: rgba(255, 255, 255, 0.7);
            border: none;
            padding: 10px 20px;
            margin-right: 5px;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }

        .nav-tabs .nav-link.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border: none;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            color: #fff;
            box-shadow: none;
        }

        .btn-primary {
            background: var(--primary);
            border: none;
            padding: 8px 20px;
        }

        .btn-primary:hover {
            background: #138496;
        }

        .alert {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录表单 -->
        <div id="authContainer" class="auth-container">
            <h2 class="text-center mb-4">登录</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">登录</button>
            </form>
        </div>

        <!-- 主界面 -->
        <div id="mainContainer" class="main-container">
            <ul class="nav nav-tabs" id="mainTabs">
                <li class="nav-item">
                    <a class="nav-link active" data-bs-toggle="tab" href="#apolloConfig">Apollo配置</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#dingTalk">钉钉集成</a>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Apollo配置管理 -->
                <div class="tab-pane fade show active" id="apolloConfig">
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <select class="form-select" id="envSelect">
                                <option value="LOCAL">本地环境</option>
                                <option value="DEV">开发环境</option>
                                <option value="PRO">生产环境</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <input type="text" class="form-control" id="appIdInput" placeholder="应用ID">
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-primary" id="queryConfig">查询配置</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-dark table-hover">
                            <thead>
                                <tr>
                                    <th>Key</th>
                                    <th>Value</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="configTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 钉钉集成 -->
                <div class="tab-pane fade" id="dingTalk">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card bg-dark">
                                <div class="card-body">
                                    <h5 class="card-title">群聊卡片</h5>
                                    <div class="mb-3">
                                        <input type="text" class="form-control" id="groupChatId" placeholder="群会话ID">
                                    </div>
                                    <button class="btn btn-primary" id="sendGroupCard">发送群聊卡片</button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card bg-dark">
                                <div class="card-body">
                                    <h5 class="card-title">私聊卡片</h5>
                                    <div class="mb-3">
                                        <input type="text" class="form-control" id="userId" placeholder="用户ID">
                                    </div>
                                    <button class="btn btn-primary" id="sendPrivateCard">发送私聊卡片</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 登录逻辑
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const userName = document.getElementById('username').value;
            const passWord = document.getElementById('password').value;
            const res = await fetch('/user/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({userName, passWord})
            });
            const data = await res.json();
            if (data.code === 200) {
                localStorage.setItem('token', data.data);
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
            } else {
                alert(data.msg || '登录失败');
            }
        });

        // 查询Apollo配置
        document.getElementById('queryConfig').addEventListener('click', async function() {
            const env = document.getElementById('envSelect').value;
            const appId = document.getElementById('appIdInput').value;
            const token = localStorage.getItem('token');
            
            if (!appId) {
                alert('请输入应用ID');
                return;
            }

            // 添加加载状态
            const queryButton = document.getElementById('queryConfig');
            const originalText = queryButton.textContent;
            queryButton.textContent = '查询中...';
            queryButton.disabled = true;

            try {
                const res = await fetch(`/apollo/${env}/${appId}/getAllKAndV`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'token': token
                    },
                    body: JSON.stringify({page: 1, size: 100})
                });
                
                const data = await res.json();
                const tbody = document.getElementById('configTableBody');
                tbody.innerHTML = '';
                
                if (data.code === 200 && Array.isArray(data.data)) {
                    if (data.data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="3" class="text-center">暂无配置数据</td></tr>';
                    } else {
                        data.data.forEach(item => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${item.key}</td>
                                <td>${item.value}</td>
                                <td>
                                    <button class="btn btn-sm btn-danger" onclick="deleteConfig('${env}', '${appId}', '${item.key}')">删除</button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }
                } else {
                    tbody.innerHTML = `<tr><td colspan="3" class="text-center text-danger">${data.msg || '查询失败'}</td></tr>`;
                }
            } catch (error) {
                console.error('查询配置失败:', error);
                document.getElementById('configTableBody').innerHTML = 
                    '<tr><td colspan="3" class="text-center text-danger">查询失败，请检查网络连接</td></tr>';
            } finally {
                // 恢复按钮状态
                queryButton.textContent = originalText;
                queryButton.disabled = false;
            }
        });

        // 添加删除配置的函数
        async function deleteConfig(env, appId, key) {
            if (!confirm(`确定要删除配置项 ${key} 吗？`)) {
                return;
            }

            const token = localStorage.getItem('token');
            try {
                const res = await fetch(`/apollo/${env}/${appId}/removeByKey/${key}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'token': token
                    }
                });
                
                const data = await res.json();
                if (data.code === 200) {
                    alert('删除成功');
                    // 重新加载配置列表
                    document.getElementById('queryConfig').click();
                } else {
                    alert(data.msg || '删除失败');
                }
            } catch (error) {
                console.error('删除配置失败:', error);
                alert('删除失败，请检查网络连接');
            }
        }

        // 钉钉群聊卡片
        document.getElementById('sendGroupCard').addEventListener('click', async function() {
            const accessToken = prompt('请输入钉钉accessToken');
            const openConversationId = document.getElementById('groupChatId').value;
            if (!accessToken || !openConversationId) {
                alert('请填写完整信息');
                return;
            }
            const res = await fetch(`/api/dingtalk/group-card?accessToken=${accessToken}&openConversationId=${openConversationId}`, {
                method: 'POST'
            });
            const data = await res.json();
            alert(data.msg || (data.code === 200 ? '发送成功' : '发送失败'));
        });

        // 钉钉私聊卡片
        document.getElementById('sendPrivateCard').addEventListener('click', async function() {
            const accessToken = prompt('请输入钉钉accessToken');
            const userid = document.getElementById('userId').value;
            if (!accessToken || !userid) {
                alert('请填写完整信息');
                return;
            }
            const res = await fetch(`/api/dingtalk/private-card?accessToken=${accessToken}&userid=${userid}`, {
                method: 'POST'
            });
            const data = await res.json();
            alert(data.msg || (data.code === 200 ? '发送成功' : '发送失败'));
        });

        // 页面初始化
        window.onload = function() {
            if (localStorage.getItem('token')) {
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
            }
        }
    </script>
</body>
</html>
